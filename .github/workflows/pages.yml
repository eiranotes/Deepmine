name: DeepMine Pages

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Build playable web game
        run: npm run build:pages
        working-directory: web
      - name: Playable artifact contract
        run: |
          test -s pages-dist/index.html
          test -s pages-dist/favicon.svg
          test -s pages-dist/assets/shaft/ShaftRock_pressure-v2.png
          test -n "$(find pages-dist/assets -maxdepth 1 -name '*.js' -print -quit)"
          test -n "$(find pages-dist/assets -maxdepth 1 -name '*.css' -print -quit)"
          grep -q '/Deepmine/assets/' pages-dist/index.html
          grep -q 'DEEPMINE / PLAYABLE WEB' pages-dist/assets/*.js
          touch pages-dist/.nojekyll
        working-directory: web
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: web/pages-dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
