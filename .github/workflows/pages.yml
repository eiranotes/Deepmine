name: DeepMine Pages

on:
  push:
    branches:
      - agent/exponential-growth-ui-review
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Bundle shared gameplay logic
        run: |
          mkdir -p pages-dist
          cp pages/index.html pages/styles.css pages/app.js pages-dist/
          npx esbuild app/coreBalance.ts \
            --bundle \
            --format=esm \
            --platform=browser \
            --outfile=pages-dist/coreBalance.js
          touch pages-dist/.nojekyll
        working-directory: web
      - name: Browser module smoke test
        run: |
          node -e "import('./pages-dist/coreBalance.js').then(m => { if (m.automationDamagePerSecond(1) !== 0 || m.automationDamagePerSecond(2) <= 0 || m.upgradeCost('drill', 201) == null) process.exit(1) })"
        working-directory: web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/pages-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
