<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DeepMine Web Logic Validation</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">DEEPMINE · CORE PARITY HARNESS</p>
      <h1>웹 성장 로직 검증</h1>
      <p>iOS DeepMineCore와 동일한 장비, 암반, 자동화, 정련 수식을 브라우저에서 실행합니다.</p>
    </header>
    <section class="status" id="status">검증 실행 중…</section>
    <section class="metrics" id="metrics"></section>
    <section>
      <h2>초기 진행 재현</h2>
      <div class="controls">
        <button id="mine">암반 타격</button>
        <button id="upgrade">추천 장비 구매</button>
        <button id="reset">초기화</button>
      </div>
      <div class="readout" id="readout"></div>
    </section>
    <section>
      <h2>자동 검증 항목</h2>
      <ol id="checks"></ol>
    </section>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
